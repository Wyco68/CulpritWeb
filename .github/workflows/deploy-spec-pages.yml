name: Deploy Docs to GitHub Pages

# Publishes the client-facing docs as the GitHub Pages site:
#   PROJECT_SPEC.html          -> index.html
#   DEVELOPMENT_PROGRESS.html  -> progress.html
#   FRONTEND.html              -> frontend.html
#   BACKEND.html               -> backend.html
#   DEPLOYMENT.html            -> deployment.html
#   HOSTING_COST.html          -> hosting-cost.html   (+ hosting-cost.pdf, hosting-cost-assets/)
# Fully independent from the Vercel application deploy — different target, different domain.
# This workflow touches nothing else in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'PROJECT_SPEC.html'
      - 'DEVELOPMENT_PROGRESS.html'
      - 'FRONTEND.html'
      - 'BACKEND.html'
      - 'DEPLOYMENT.html'
      - 'HOSTING_COST.html'
      - 'hosting-cost.pdf'
      - 'hosting-cost-assets/**'
      - '.github/workflows/deploy-spec-pages.yml'
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          if [ ! -f PROJECT_SPEC.html ]; then
            echo "PROJECT_SPEC.html not found — nothing to publish." >&2
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          cp PROJECT_SPEC.html _site/index.html
          for pair in "DEVELOPMENT_PROGRESS.html:progress.html" "FRONTEND.html:frontend.html" "BACKEND.html:backend.html" "DEPLOYMENT.html:deployment.html" "HOSTING_COST.html:hosting-cost.html" "hosting-cost.pdf:hosting-cost.pdf"; do
            src="${pair%%:*}"
            dest="${pair##*:}"
            if [ -f "$src" ]; then
              cp "$src" "_site/$dest"
            fi
          done
          # Screenshots referenced by hosting-cost.html. Images only, nothing else.
          if [ -d hosting-cost-assets ]; then
            mkdir -p _site/hosting-cost-assets
            cp hosting-cost-assets/*.png _site/hosting-cost-assets/
          fi
          # Do NOT copy any other file. The Pages site is these docs only.

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
